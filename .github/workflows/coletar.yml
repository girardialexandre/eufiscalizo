name: Coletar agenda e gastos federais

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 03h17 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar dados
        run: node coletor/coletar.mjs
        env:
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || git commit -m "Atualiza agenda e gastos federais"
          git push
